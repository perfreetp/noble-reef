<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>GRIND · 滑板场地几何建模</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M3 26h8l3-14h9" />
            <path d="M16 18h9" />
            <circle cx="24.5" cy="25.5" r="1.6" />
            <circle cx="7.5" cy="25.5" r="1.6" />
          </svg>
          <div class="brand-text">
            <span class="brand-name">GRIND</span>
            <span class="brand-sub">滑板场地几何建模</span>
          </div>
        </div>

        <div class="project-field">
          <label class="micro" for="project-name">场地</label>
          <input id="project-name" class="project-name" spellcheck="false" maxlength="60" />
          <span id="save-state" class="save-state">已保存</span>
        </div>

        <div class="topbar-spacer"></div>

        <div class="topbar-group">
          <button class="icon-btn" id="btn-new" title="新建 / 打开示例" aria-label="新建场地">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <button class="icon-btn" id="btn-undo" title="撤销 (Ctrl+Z)" aria-label="撤销">
            <svg viewBox="0 0 24 24"><path d="M9 7H15.5A4.5 4.5 0 0 1 20 11.5V11.5A4.5 4.5 0 0 1 15.5 16H8" /><path d="M11.5 4 8 7l3.5 3" /></svg>
          </button>
          <button class="icon-btn" id="btn-redo" title="重做 (Ctrl+Shift+Z)" aria-label="重做">
            <svg viewBox="0 0 24 24"><path d="M15 7H8.5A4.5 4.5 0 0 0 4 11.5V11.5A4.5 4.5 0 0 0 8.5 16H16" /><path d="M12.5 4 16 7l-3.5 3" /></svg>
          </button>
        </div>

        <div class="topbar-group segmented" id="snap-group" role="group" aria-label="吸附">
          <button class="seg" id="btn-snap" data-active="true" title="吸附到 0.1 m 网格 (S)">
            <svg viewBox="0 0 24 24"><path d="M4 20h16M8 20V9l4-5 4 5v11" /></svg>
            <span>吸附</span><b id="snap-step">0.1</b>
          </button>
          <button class="seg" id="btn-edge-snap" data-active="true" title="边缘对齐吸附">边缘</button>
        </div>

        <div class="topbar-group">
          <button class="btn" id="btn-view-fit" title="框选全部 (F)">全览</button>
          <div class="menu-wrap">
            <button class="btn btn-primary" id="btn-export">
              导出
              <svg class="chev" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></svg>
            </button>
            <div class="menu" id="export-menu" hidden>
              <button data-export="project">
                <b>项目文件</b><span>.grind.json · 几何 + 布局，可再导入</span>
              </button>
              <button data-export="stl">
                <b>模型 STL</b><span>合并后的实体网格，用于分享/打印</span>
              </button>
              <button data-export="glb">
                <b>模型 glTF</b><span>.glb · 带材质与颜色</span>
              </button>
              <button data-export="collision">
                <b>碰撞网格</b><span>.json + .obj · 供轨迹检测</span>
              </button>
            </div>
          </div>
          <button class="btn" id="btn-import" title="导入项目文件">导入</button>
          <input type="file" id="file-import" accept=".json,application/json" hidden />
          <button class="icon-btn" id="btn-help" title="操作速查 (?)" aria-label="帮助">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M9.2 9.4a2.9 2.9 0 1 1 4 2.7c-.7.3-1.2.9-1.2 1.7v.4M12 17.2h.01" /></svg>
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="panel panel-left" id="panel-left">
          <div class="panel-section lib-section">
            <div class="panel-head">
              <span class="micro">元素库</span>
              <span class="panel-head-hint">点击放置</span>
            </div>
            <div class="category-tabs" id="category-tabs"></div>
            <div class="lib-scroll" id="library"></div>
          </div>
          <div class="panel-section tree-section">
            <div class="panel-head">
              <span class="micro">场地结构</span>
              <span class="panel-head-hint" id="tree-count">0</span>
            </div>
            <div class="tree" id="tree"></div>
          </div>
        </aside>

        <section class="viewport" id="viewport">
          <canvas id="scene"></canvas>

          <div class="vp-top">
            <div class="segmented view-modes" role="group" aria-label="视图">
              <button class="seg" data-view="iso" data-active="true">等轴</button>
              <button class="seg" data-view="top">俯视</button>
              <button class="seg" data-view="front">正视</button>
              <button class="seg" data-view="side">侧视</button>
            </div>
            <div class="vp-badges">
              <button class="chip" id="chip-edges" data-active="true" title="显示轮廓线">
                <svg viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z" /><path d="M4 7.5 12 12l8-4.5M12 12v9" /></svg>
                轮廓
              </button>
              <button class="chip" id="chip-grid" data-active="true" title="显示网格">
                <svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M9 3v18M15 3v18" /></svg>
                网格
              </button>
              <button class="chip" id="chip-collision" data-active="false" title="显示碰撞网格">
                <svg viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z" /><path d="m8 9 4 2.2L16 9M12 11.2V16" /></svg>
                碰撞体
              </button>
              <button class="chip" id="chip-cutters" data-active="false" title="显示被差集的切割体">
                <svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="4" /><circle cx="16" cy="12" r="4" /></svg>
                切割体
              </button>
            </div>
          </div>

          <div class="gizmo-rail" role="group" aria-label="变换工具">
            <button class="gizmo-btn" data-gizmo="translate" data-active="true" title="移动 (G)">
              <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3 9.5 5.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5" /></svg>
              <span>移动</span>
            </button>
            <button class="gizmo-btn" data-gizmo="rotate" title="旋转 (R)">
              <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2" /><path d="M20 4v4h-4" /></svg>
              <span>旋转</span>
            </button>
            <button class="gizmo-btn" data-gizmo="scale" title="尺寸 (T)">
              <svg viewBox="0 0 24 24"><path d="M5 19 19 5M5 19h6M5 19v-6M19 5h-6M19 5v6" /></svg>
              <span>尺寸</span>
            </button>
          </div>

          <div class="coach" id="coach" hidden>
            <div class="coach-head">
              <span class="micro">布局提示</span>
              <button class="coach-close" id="coach-close" aria-label="关闭">×</button>
            </div>
            <div id="coach-body"></div>
          </div>

          <div class="vp-hint" id="vp-hint">左键拖动元素 · 右键/中键平移视角 · 滚轮缩放</div>
          <div class="mobile-tabbar" id="mobile-tabbar">
            <button data-mobile="library">元素库</button>
            <button data-mobile="inspector">属性</button>
          </div>
          <div class="loading" id="loading">
            <div class="loading-mark"></div>
            <div class="loading-text">正在载入几何引擎…</div>
          </div>
        </section>

        <aside class="panel panel-right" id="panel-right">
          <div class="inspector" id="inspector"></div>
        </aside>
      </main>

      <footer class="statusbar">
        <div class="status-left">
          <span class="status-dot" id="engine-dot"></span>
          <span id="engine-status">几何引擎</span>
          <span class="sep"></span>
          <span id="status-hint">选择一个元素开始编辑</span>
        </div>
        <div class="status-right">
          <span class="stat"><b id="stat-elements">0</b> 元素</span>
          <span class="stat"><b id="stat-groups">0</b> 合并组</span>
          <span class="stat"><b id="stat-tris">0</b> 三角面</span>
          <span class="stat"><b id="stat-edges">0</b> 轮廓段</span>
          <span class="stat"><b id="stat-ms">0</b> ms</span>
          <span class="stat stat-ops" title="并集与差集累计次数"><b id="stat-ops">0</b> 次合并</span>
        </div>
      </footer>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <dialog id="help-dialog" class="dialog">
      <div class="dialog-head">
        <span class="micro">操作速查</span>
        <form method="dialog"><button class="icon-btn" aria-label="关闭">×</button></form>
      </div>
      <div class="dialog-body" id="help-body"></div>
    </dialog>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
